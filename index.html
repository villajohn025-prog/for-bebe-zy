/* Layout: one-screen story. Fixed full-viewport layers stacked by z-index:
   question (blush) -> heart loader -> night garden canvas -> letter overlay (blur, envelope, paper) -> Show/Hide button */
:root {
  --blush-top: #efdde0;
  --blush: #f9e5e6;
  --rose: #da7488;
  --rose-soft: #eb9aac;
  --ink: #151013;
  --night-1: #0c1622;
  --night-2: #050d19;
  --night-3: #000012;
  --paper: #fffaf6;
  --paper-ink: #4a2433;
  --paper-rule: rgba(226, 150, 178, .40);
  --paper-margin: rgba(240, 128, 162, .42);
  --env-hi: #fbbccd;
  --env-lo: #f29bb3;
  --env-in-top: #c95a7e;
  --env-in-bot: #f09cb4;
  --name-ink: #a92f58;
  --glow-pink: #ffd9e8;
  --font-display: "Quicksand", ui-rounded, "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-script: "Dancing Script", "Segoe Script", "Brush Script MT", cursive;
  --font-hand: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --font-btn: Arial, Helvetica, sans-serif;
  --fy: clamp(28px, min(7.2vw, 5.5vh), 46px);
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--blush);
  color: var(--ink);
  font-family: var(--font-display);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
html.is-night body { background: var(--night-3); }
button { font: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.font-warm { position: absolute; left: -9999px; top: 0; opacity: 0; pointer-events: none; }

/* ---------- Question page ---------- */
.q-scene {
  position: fixed; inset: 0; z-index: 1;
  display: grid; place-items: center;
  background: linear-gradient(180deg, var(--blush-top) 0%, var(--blush) 34%, var(--blush) 100%);
  overflow: hidden;
  transition: opacity .6s ease;
}
.q-wrap {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center;
  gap: clamp(16px, 5.2vh, 46px);
  padding: 24px 16px;
  text-align: center;
  transform: translateY(-2.5vh);
  transition: opacity .38s ease, transform .38s ease;
}
.q-scene.leaving .q-wrap { opacity: 0; transform: translateY(-4vh) scale(.96); }
.photo-card {
  position: relative;
  width: clamp(130px, min(58vw, 40vh), 262px);
  aspect-ratio: 1 / 1;
  max-width: 100%;
  border-radius: 10px;
  background: linear-gradient(180deg, #ffffff 0%, #fff6f8 48%, #ffe4eb 100%);
  box-shadow: 0 18px 36px -18px rgba(190, 86, 114, .45), 0 2px 8px rgba(190, 86, 114, .10);
  overflow: hidden;
  animation: cardFloat 5.5s ease-in-out infinite;
}
.photo-card img {
  position: absolute; left: 0; bottom: 0; z-index: 2;
  width: 100%; height: 100%; object-fit: contain; object-position: center bottom;
  user-select: none; -webkit-user-select: none; -webkit-user-drag: none;
  pointer-events: none;
}
.card-heart {
  position: absolute; z-index: 1; display: block;
  width: var(--s); height: var(--s);
  left: var(--x); top: var(--y);
  color: var(--c);
  opacity: 0;
  animation: cardHeart var(--d) ease-out var(--delay) infinite;
}
.card-heart svg, .bg-heart svg, .burst svg { width: 100%; height: 100%; display: block; }
.q-title {
  margin: 0;
  max-width: min(92vw, 620px);
  font: 700 clamp(20px, min(5.6vw, 6.4vh), 36px) / 1.28 var(--font-display);
  color: var(--ink);
  letter-spacing: -.005em;
  text-wrap: balance;
}
.q-btns { display: flex; align-items: center; justify-content: center; gap: 26px; margin-top: -6px; }
.no-slot { display: inline-block; }
.pill {
  font: 400 15px/1 var(--font-btn);
  color: #fff;
  background: var(--rose);
  border: 0; border-radius: 999px;
  padding: 10px 22px;
  box-shadow: 0 6px 16px -5px rgba(218, 116, 136, .75);
  cursor: pointer;
  transition: background .2s ease, transform .2s ease, box-shadow .2s ease, opacity .3s ease;
}
#yesBtn:hover { background: var(--rose-soft); transform: scale(1.07); box-shadow: 0 8px 22px -6px rgba(218, 116, 136, .85); }
#yesBtn:active { transform: scale(.97); }
#yesBtn:focus-visible { outline: 3px solid rgba(218, 116, 136, .45); outline-offset: 3px; }
#noBtn { pointer-events: none; }
#noBtn.free {
  position: fixed; z-index: 40; margin: 0;
  transition: left .34s cubic-bezier(.2, .9, .25, 1), top .34s cubic-bezier(.2, .9, .25, 1), opacity .3s ease;
}
#noBtn.gone { opacity: 0; }
.bg-hearts { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.bg-heart {
  position: absolute; bottom: -48px; left: var(--x);
  width: var(--s); height: var(--s);
  color: var(--c); opacity: var(--o);
  animation: rise var(--d) linear var(--delay) infinite;
}
.bg-heart svg { animation: sway calc(var(--d) / 4) ease-in-out infinite alternate; }
.burst { position: fixed; z-index: 45; width: 16px; height: 16px; margin: -8px 0 0 -8px; pointer-events: none; color: #ef6f92; }
.puff { position: fixed; z-index: 41; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #f3a0b4; pointer-events: none; }

@keyframes cardFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes cardHeart {
  0% { opacity: 0; transform: translateY(14px) scale(.5) rotate(0deg); }
  18% { opacity: .95; }
  100% { opacity: 0; transform: translateY(-64px) scale(1.15) rotate(var(--r)); }
}
@keyframes rise { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(0, calc(-100vh - 110px), 0); } }
@keyframes sway { from { transform: translateX(calc(var(--sx) * -1)) rotate(-12deg); } to { transform: translateX(var(--sx)) rotate(12deg); } }

/* ---------- Heart loader (from the video) ---------- */
.loader { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; pointer-events: none; transition: opacity .45s ease; }
.loader.fade { opacity: 0; }
.ld { position: relative; width: 82px; height: 98px; transform: translateY(-3vh); }
.ld-heart {
  position: absolute; left: 7px; top: 4px; width: 68px; height: 62px;
  color: #e3343e;
  animation: hspin 2.3s cubic-bezier(.45, .05, .35, 1) both;
}
.ld-heart svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 2px rgba(150, 20, 30, .18)); }
.ld-shadow {
  position: absolute; left: 50%; bottom: 0; width: 48px; height: 9px; margin-left: -24px;
  border-radius: 50%; background: rgba(120, 40, 55, .16);
  animation: hshadow 2.3s cubic-bezier(.45, .05, .35, 1) both;
}
@keyframes hspin {
  0%   { transform: perspective(320px) rotateZ(0deg)   rotateY(0deg)   scale(.2); opacity: 0; }
  8%   { transform: perspective(320px) rotateZ(0deg)   rotateY(0deg)   scale(1);  opacity: 1; }
  18%  { transform: perspective(320px) rotateZ(-14deg) rotateY(0deg)   scale(1.03); }
  34%  { transform: perspective(320px) rotateZ(20deg)  rotateY(170deg) scale(.6); }
  48%  { transform: perspective(320px) rotateZ(34deg)  rotateY(320deg) scale(.15); }
  58%  { transform: perspective(320px) rotateZ(34deg)  rotateY(360deg) scale(.15); }
  76%  { transform: perspective(320px) rotateZ(-12deg) rotateY(530deg) scale(.72); }
  90%  { transform: perspective(320px) rotateZ(4deg)   rotateY(700deg) scale(1.05); }
  100% { transform: perspective(320px) rotateZ(0deg)   rotateY(720deg) scale(1); }
}
@keyframes hshadow {
  0% { transform: scaleX(.2); opacity: 0; }
  8%, 18% { transform: scaleX(1); opacity: 1; }
  48%, 58% { transform: scaleX(.24); opacity: .45; }
  90%, 100% { transform: scaleX(1); opacity: 1; }
}

/* ---------- Night garden ---------- */
.night {
  position: fixed; inset: 0; z-index: 3;
  background: linear-gradient(180deg, var(--night-1) 0%, #08121e 26%, var(--night-2) 52%, var(--night-3) 100%);
  clip-path: circle(0px at 50% 47%);
  -webkit-clip-path: circle(0px at 50% 47%);
  transition: clip-path 1.25s cubic-bezier(.66, 0, .3, 1), -webkit-clip-path 1.25s cubic-bezier(.66, 0, .3, 1);
}
.night.revealed { clip-path: circle(150vmax at 50% 47%); -webkit-clip-path: circle(150vmax at 50% 47%); }
.night canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.night-vignette {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(120% 70% at 50% -6%, rgba(70, 92, 130, .17), transparent 62%),
    radial-gradient(150% 90% at 50% 118%, rgba(0, 0, 8, .6), transparent 58%);
}
.for-you {
  position: absolute; left: 0; right: 0; z-index: 2;
  top: calc(env(safe-area-inset-top, 0px) + 18px);
  margin: 0; padding: 0 16px;
  text-align: center;
  font: 700 var(--fy) / 1.2 var(--font-script);
  color: var(--glow-pink);
  text-shadow: 0 0 18px rgba(255, 128, 182, .7), 0 0 3px rgba(255, 226, 238, .85);
  pointer-events: none;
}
.for-you span {
  display: inline-block; white-space: pre;
  opacity: 0; transform: translateY(12px) scale(.9); filter: blur(5px);
  transition: opacity .8s ease, transform .8s cubic-bezier(.2, .9, .3, 1.2), filter .8s ease;
}
.for-you.on span { opacity: 1; transform: none; filter: none; }

/* ---------- Show / Hide button ---------- */
.toggle {
  position: fixed; z-index: 30; left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 18px + 1.2 * var(--fy) + 12px);
  transform: translate(-50%, 8px);
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 20px 10px 16px;
  border-radius: 999px;
  border: 1px solid rgba(255, 190, 214, .55);
  background: rgba(255, 190, 214, .14);
  color: #ffe8f1;
  font: 700 15px/1 var(--font-display);
  letter-spacing: .03em;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  box-shadow: 0 10px 26px -12px rgba(255, 105, 170, .9), inset 0 1px 0 rgba(255, 255, 255, .18);
  cursor: pointer;
  opacity: 0;
  transition: top .55s cubic-bezier(.3, .9, .3, 1), transform .55s cubic-bezier(.3, .9, .3, 1), opacity .5s ease, background .25s ease;
}
.toggle.on { opacity: 1; transform: translate(-50%, 0); }
.toggle.top { top: calc(env(safe-area-inset-top, 0px) + 12px); }
.toggle:hover { background: rgba(255, 190, 214, .26); }
.toggle:focus-visible { outline: 2px solid #ffd3e4; outline-offset: 3px; }
.toggle svg { width: 18px; height: 18px; display: block; }
.toggle .ring { position: absolute; inset: -1px; border-radius: inherit; pointer-events: none; animation: ring 2.2s ease-out infinite; }
.toggle.top .ring, .toggle.seen .ring { animation: none; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(255, 175, 210, .5); } 75%, 100% { box-shadow: 0 0 0 12px rgba(255, 175, 210, 0); } }

/* ---------- Letter overlay ---------- */
.letter-layer {
  position: fixed; inset: 0; z-index: 10;
  touch-action: none;
  opacity: 0;
  transition: opacity .5s ease;
  user-select: none; -webkit-user-select: none;
}
.letter-layer.on { opacity: 1; }
.letter-layer.grab { cursor: grab; }
.letter-layer.grabbing { cursor: grabbing; }
.lt-blur {
  position: absolute; inset: 0;
  background: rgba(9, 6, 20, .42);
  -webkit-backdrop-filter: blur(12px) saturate(1.15); backdrop-filter: blur(12px) saturate(1.15);
}
.env { position: absolute; left: 0; top: 0; width: var(--envW); height: var(--envH); transform-origin: 50% 50%; will-change: transform; }
.env-back { z-index: 1; }
.env-front { z-index: 3; pointer-events: none; }
.env-panel {
  position: absolute; inset: 0; border-radius: 9px;
  background: linear-gradient(180deg, var(--env-in-top) 0%, #e07f9d 40%, var(--env-in-bot) 100%);
  box-shadow: 0 34px 60px -26px rgba(0, 0, 0, .75), 0 12px 24px -14px rgba(0, 0, 0, .5);
}
.flap { position: absolute; left: 0; top: 0; width: 100%; height: 62%; transform-origin: 50% 0; will-change: transform; }
.flap-face { position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 54% 92%, 50% 100%, 46% 92%); }
.flap-front { z-index: 2; filter: drop-shadow(0 3px 3px rgba(140, 32, 72, .30)); }
.flap-front .flap-face { background: linear-gradient(180deg, #f7a6bd 0%, #f39ab3 55%, #ec8ca8 100%); }
.flap-back .flap-face {
  background:
    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .6) 0 1.3px, transparent 1.9px) 0 0 / 12px 12px,
    linear-gradient(180deg, #ffdbe5 0%, #ffc6d6 100%);
}
.pocket { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; filter: drop-shadow(0 -1px 1px rgba(150, 40, 80, .18)); }
.env-to {
  position: absolute; left: 0; right: 0; top: 74%; z-index: 1;
  text-align: center;
  font: 700 calc(var(--envW) * .088) / 1 var(--font-script);
  color: var(--name-ink);
  transform: rotate(-3deg);
  text-shadow: 0 1px 0 rgba(255, 255, 255, .45);
}
.env-hit { position: absolute; inset: 0; z-index: 2; border-radius: 9px; cursor: pointer; pointer-events: auto; }
.env-hit[hidden] { display: none; }
.seal {
  position: absolute; left: 50%; top: 56%; z-index: 3;
  width: calc(var(--envW) * .19); height: calc(var(--envW) * .19);
  padding: 0; border: 0; border-radius: 50%;
  background: none; cursor: pointer; pointer-events: auto;
  transform: translate(-50%, -50%);
  will-change: transform, opacity;
}
.seal svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 3px 3px rgba(90, 10, 40, .35)); }
.seal span {
  position: absolute; inset: 0; display: grid; place-items: center;
  font: 700 calc(var(--envW) * .056) / 1 var(--font-script);
  color: #ffe6ef;
  text-shadow: 0 1px 1px rgba(90, 0, 30, .55);
  padding-bottom: 2px;
}
.seal::after {
  content: ""; position: absolute; inset: -5px; border-radius: 50%;
  animation: sealPulse 1.9s ease-out infinite;
}
.seal:focus-visible { outline: 2px solid #ffe2ec; outline-offset: 5px; }
@keyframes sealPulse { 0% { box-shadow: 0 0 0 0 rgba(255, 170, 205, .6); } 70%, 100% { box-shadow: 0 0 0 16px rgba(255, 170, 205, 0); } }

.paper-stage { position: absolute; inset: 0; z-index: 2; pointer-events: none; perspective: 1000px; }
.strip {
  position: absolute; left: 0; top: 0;
  width: var(--pw);
  overflow: hidden;
  transform-origin: 50% 100%;
  will-change: transform;
  pointer-events: none;
}
.strip.first { border-radius: 5px 5px 0 0; }
.strip.last { border-radius: 0 0 5px 5px; }
.shade { position: absolute; inset: 0; background: #2a0a17; opacity: 0; will-change: opacity; pointer-events: none; }
.pc {
  position: absolute; left: 0; top: 0;
  width: var(--pw);
  box-sizing: border-box;
  padding: calc(var(--lh) * 1.5) 14px calc(var(--lh) * .5) 25px;
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, transparent 17px, var(--paper-margin) 17px, var(--paper-margin) 18px, transparent 18px),
    repeating-linear-gradient(180deg, transparent 0, transparent calc(var(--lh) - 1px), var(--paper-rule) calc(var(--lh) - 1px), var(--paper-rule) var(--lh));
  background-position: 0 0, 0 calc(var(--lh) * 1.5);
  box-shadow: inset 1px 0 rgba(214, 140, 166, .5), inset -1px 0 rgba(214, 140, 166, .5);
  color: var(--paper-ink);
  font-family: var(--font-hand);
  font-weight: 500;
  font-size: var(--fs);
  line-height: var(--lh);
  overflow-wrap: break-word;
}
.pc p { margin: 0 0 var(--lh); }
.pc-top { position: absolute; left: 0; right: 0; top: calc(var(--lh) * .32); display: flex; justify-content: center; gap: 7px; color: #f08fae; }
.pc-top svg { width: 11px; height: 11px; display: block; }
.pc-top svg:nth-child(2) { width: 14px; height: 14px; margin-top: -2px; color: #ea6d96; }
.pc .sign { display: flex; flex-direction: column; align-items: flex-end; padding-right: 8px; }
.pc .sign .nm { font: 700 calc(var(--fs) * 1.5) / calc(var(--lh) * 2) var(--font-script); color: #c13f69; }
.pc-end { display: flex; justify-content: center; align-items: center; height: calc(var(--lh) * 3); }
.close-env {
  pointer-events: auto;
  display: inline-flex; align-items: center; gap: 7px;
  font: 700 15px/1 var(--font-display);
  color: #fff;
  background: linear-gradient(180deg, #ef809e, #d8577d);
  border: 0; border-radius: 999px;
  padding: 11px 18px;
  box-shadow: 0 7px 16px -7px rgba(196, 50, 96, .85);
  cursor: pointer;
  transition: transform .2s ease;
}
.close-env svg { width: 16px; height: 16px; display: block; }
.close-env:hover { transform: scale(1.05); }
.close-env.ready { animation: readyPulse 1.6s ease-in-out infinite; }
@keyframes readyPulse { 0%, 100% { box-shadow: 0 7px 16px -7px rgba(196, 50, 96, .85), 0 0 0 0 rgba(239, 128, 158, .45); } 50% { box-shadow: 0 7px 16px -7px rgba(196, 50, 96, .85), 0 0 0 9px rgba(239, 128, 158, 0); } }

.paper-gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.close-env.solo { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: none; will-change: transform; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.pull-hint {
  position: absolute; left: 50%; top: 0; z-index: 4;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: #ffe4ef;
  font: 600 14px/1.25 var(--font-display);
  letter-spacing: .02em;
  text-shadow: 0 1px 10px rgba(0, 0, 0, .55);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity .45s ease;
}
.pull-hint.on { opacity: 1; }
.pull-hint svg { width: 22px; height: 22px; display: block; animation: bob 1.15s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(3px); } 50% { transform: translateY(-4px); } }

@media (prefers-reduced-motion: reduce) {
  .bg-hearts, .card-heart { display: none; }
  .photo-card { animation: none; }
}
</style>

  /* ================= 3. Night garden (canvas) ================= */
  const Night = (() => {

    function drawStars() {

      for (let gy = 0; gy < H + gapPx; gy += gapPx) {

      ctx.fillStyle = GR.petal; ctx.fill();
      ctx.lineWidth = 1.2; ctx.strokeStyle = EDGE; ctx.stroke();
      ctx.beginPath();

      ctx.moveTo(3, -27); ctx.quadraticCurveTo(15, -44, 15, -60);

    }
    const tmpA = [0, 0, 0];
    function computeSpine(t, mx, my) {
      nS = 0;
      const bounds = GLP.bounds;
      let bi = bounds.length - 1;
      while (bi >= 0 && bounds[bi] >= E) bi--;
      let s = 0, x = mx, y = my, z = 0;
      angles(0, E, t, tmpA);
      pushSample(E, x, y, z, tmpA[0], tmpA[1], tmpA[2]);
      while (s < E - 1e-4) {
        let next = Math.min(E, s + DS);
        const nb = bi >= 0 ? E - bounds[bi] : Infinity;
        if (nb > s + 1e-4 && nb <= next) { next = nb; bi--; }
        const mid = (s + next) / 2;
        angles(mid, E - mid, t, tmpA);
        const h = next - s, cph = Math.cos(tmpA[2]);
        x += cph * Math.sin(tmpA[1]) * h;
        y -= cph * Math.cos(tmpA[1]) * h;
        z -= Math.sin(tmpA[2]) * h;
        s = next;
        angles(s, E - s, t, tmpA);
        if (!pushSample(E - s, x, y, z, tmpA[0], tmpA[1], tmpA[2])) break;
        if (y < -220) break;
      }
      // reverse so rows run from the paper top downwards
      for (let i = 0, j = nS - 1; i < j; i++, j--) { const tmp = POOL[i]; POOL[i] = POOL[j]; POOL[j] = tmp; }
      // flat part still inside the envelope
      const rEnd = Math.min(PH, E + envH * .85);
      for (const R of bounds) if (R > E + 1e-3 && R < rEnd - 1e-3) pushSample(R, mx, my + (R - E), 0, 0, 0, 0);
      if (rEnd > E + 1e-3) pushSample(rEnd, mx, my + (rEnd - E), 0, 0, 0, 0);
      return nS;
    }

    function placeSoloButton(mx, my) {
      if (!soloBtn) return;
      const deep = btnRow - E;
      if (deep > envH * .7) { setStyle(soloBtn, 'visibility', 'hidden'); return; }
      let o = null;
      if (btnRow >= E) {
        o = { x: mx, y: my + (btnRow - E), z: 0, wx: 1, wy: 0, wz: 0, dx: 0, dy: 1, dz: 0, nx: 0, ny: 0, nz: 1 };
      } else {
        for (let k = 0; k < nS - 1; k++) {
          const a = POOL[k], b = POOL[k + 1];
          if (a.r <= btnRow && b.r >= btnRow) {
            const f = (btnRow - a.r) / Math.max(1e-3, b.r - a.r);
            o = {};
            for (const key of ['x', 'y', 'z', 'wx', 'wy', 'wz', 'dx', 'dy', 'dz', 'nx', 'ny', 'nz']) o[key] = a[key] + (b[key] - a[key]) * f;
            break;
          }
        }
      }
      if (!o) { setStyle(soloBtn, 'visibility', 'hidden'); return; }
      const tx = o.x - o.wx * btnW / 2 - o.dx * btnH / 2;
      const ty = o.y - o.wy * btnW / 2 - o.dy * btnH / 2;
      const tz = o.z - o.wz * btnW / 2 - o.dz * btnH / 2;
      const f4 = v => v.toFixed(5);
      setStyle(soloBtn, 'visibility', 'visible');
      setStyle(soloBtn, 'transform', `matrix3d(${f4(o.wx)},${f4(o.wy)},${f4(o.wz)},0,${f4(o.dx)},${f4(o.dy)},${f4(o.dz)},0,${f4(o.nx)},${f4(o.ny)},${f4(o.nz)},0,${tx.toFixed(2)},${ty.toFixed(2)},${tz.toFixed(2)},1)`);
    }

    function vis(s, on) { if (s.vis !== on) { s.vis = on; s.el.style.visibility = on ? 'visible' : 'hidden'; } }

    function placeStrips(t, mx, my) {
      const im = clamp(Math.floor(E / SH), 0, N - 1);
      const deep = my + envH * .8;
      const left0 = mx - PW / 2;
      for (let i = N - 1; i >= im; i--) {
        const s = strips[i];
        const bottom = my + ((i + 1) * SH - E);
        if (bottom - SH > deep) { vis(s, false); continue; }
        vis(s, true);
        setStyle(s.el, 'transform', `translate3d(${left0.toFixed(2)}px, ${(bottom - SH - 1).toFixed(2)}px, 0)`);
        setStyle(s.sh, 'opacity', '0');
      }
      let px = mx, py = my - (E - im * SH), pz = 0;
      for (let i = im - 1; i >= 0; i--) {
        const s = strips[i];
        if (py < -SH * 3) { vis(s, false); continue; }
        const arc = E - i * SH - SH / 2;
        angles(arc, i * SH + SH / 2, t, tmpA);
        const theta = tmpA[0], psi = tmpA[1], phi = tmpA[2];
        vis(s, true);
        setStyle(s.el, 'transform', `translate3d(${(px - PW / 2).toFixed(2)}px, ${(py - SH - 1).toFixed(2)}px, ${pz.toFixed(2)}px) rotateZ(${psi.toFixed(4)}rad) rotateX(${phi.toFixed(4)}rad) rotateY(${theta.toFixed(4)}rad)`);
        setStyle(s.sh, 'opacity', Math.min(.42, Math.abs(Math.sin(theta)) * .55 + Math.abs(phi) * .2).toFixed(3));
        const cp = Math.cos(phi);
        px += cp * Math.sin(psi) * SH;
        py -= cp * Math.cos(psi) * SH;
        pz -= Math.sin(phi) * SH;
      }
    }

    function setEnd(on) {
      if (atEnd === on) return;
      atEnd = on;
      stage.querySelectorAll('.close-env').forEach(b => b.classList.toggle('ready', on));
    }
    function showHint(on) {
      if (hintOn === on) return;
      hintOn = on;
      hint.classList.toggle('on', on);
    }

    function update(now, dt) {
      if (state === 'none' || layer.hidden) return;
      if (state === 'open') {
        if (!dragging) {
          if (Math.abs(flingV) > 2) { Et += flingV * dt; flingV *= Math.exp(-dt * 3.2); } else flingV = 0;
          if (Et > Emax) { Et += (Emax - Et) * Math.min(1, dt * 10); flingV = Math.min(flingV, 0); }
          if (Et < PEEK) { Et += (PEEK - Et) * Math.min(1, dt * 10); flingV = Math.max(flingV, 0); }
        }
        E += (Et - E) * (1 - Math.exp(-dt * 15));
        setEnd(E > Emax - 10);
        if (!hintDone && E > PEEK + 36) { hintDone = true; showHint(false); }
      }
      const v = (E - Eprev) / Math.max(dt, 1e-3);
      Eprev = E;
      velS += (v - velS) * Math.min(1, dt * 9);
      const target = clamp(Math.abs(velS) / 620, 0, 1);
      energy += (target - energy) * Math.min(1, dt * (target > energy ? 5 : 1.15));
      setAmps();

      const top = lerp(closedTop, openTop, eInOutCubic(glide)) + appearY;
      const left = (vw - envW) / 2;
      const tf = `translate3d(${left.toFixed(2)}px, ${top.toFixed(2)}px, 0) rotate(${shakeA.toFixed(3)}deg) scale(${appearS.toFixed(4)})`;
      setStyle(envB, 'transform', tf);
      setStyle(envF, 'transform', tf);
      const persp = Math.round(envW * 2.8);
      if (flapA < 90) {
        setStyle(flapF, 'visibility', 'visible'); setStyle(flapB, 'visibility', 'hidden');
        setStyle(flapF, 'transform', `perspective(${persp}px) rotateX(${flapA.toFixed(2)}deg)`);
      } else {
        setStyle(flapF, 'visibility', 'hidden'); setStyle(flapB, 'visibility', 'visible');
        setStyle(flapB, 'transform', `perspective(${persp}px) rotateX(${flapA.toFixed(2)}deg)`);
      }
      setStyle(seal, 'transform', `translate(-50%, -50%) rotate(${sealR.toFixed(2)}deg) scale(${sealS.toFixed(4)})`);
      setStyle(seal, 'opacity', sealO.toFixed(3));
      setStyle(seal, 'visibility', sealO > .01 ? 'visible' : 'hidden');

      if (paperOn && built) {
        const mx = vw / 2, my = top, ox = mx, oy = my - 170;
        setStyle(stage, 'perspectiveOrigin', `${ox.toFixed(1)}px ${oy.toFixed(1)}px`);
        if (mode === 'gl') {
          const n = computeSpine(now, mx, my);
          GLP.draw(POOL, n, { vw, vh, ox, oy, d: PERSP, fadeTop: maskTop });
          placeSoloButton(mx, my);
        } else {
          placeStrips(now, mx, my);
        }
      }
      if (hintOn) {
        const y = Math.max(maskTop + 6, Math.min(top - E, top - envH * .62) - 50);
        setStyle(hint, 'transform', `translate(-50%, ${y.toFixed(1)}px)`);
      }
    }

    function setPaper(on) {
      paperOn = on;
      setStyle(stage, 'visibility', on ? 'visible' : 'hidden');
      if (!on && GLP && mode === 'gl') GLP.clear();
    }

    async function open() {
      if (state !== 'closed') return;
      state = 'opening';
      hit.hidden = true;
      seal.disabled = true;
      if (!built || dirty) await build();
      E = Et = Eprev = 0;
      setPaper(true);
      sealBurst();
      await tween(.34, p => { sealS = 1 + .22 * Math.sin(Math.min(1, p * 2) * Math.PI / 2) - 1.1 * eInOutCubic(p); sealO = 1 - smooth(.35, 1, p); sealR = -18 * p; });
      sealS = 0; sealO = 0;
      await tween(.62, p => { flapA = 180 * p; }, eInOutCubic);
      const peek = tween(.6, p => { E = Et = PEEK * p; }, t => eOutBack(t, 1.5));
      energy = Math.max(energy, .55);
      await wait(.16);
      await tween(.85, p => { glide = p; });
      await peek;
      E = Et = PEEK;
      state = 'open';
      layer.classList.add('grab');
      if (!hintDone) showHint(true);
    }

    async function close() {
      if (state !== 'open') return;
      state = 'closing';
      layer.classList.remove('grab', 'grabbing');
      dragging = false; flingV = 0;
      showHint(false);
      setEnd(false);
      const from = E;
      const dur = clamp(.9 + from / 1700, .9, 2.2);
      await tween(dur, p => { E = Et = lerp(from, 0, p); energy = Math.max(energy, .4 * (1 - p)); }, eInOutCubic);
      E = Et = 0;
      await tween(.7, p => { glide = 1 - p; });
      await tween(.6, p => { flapA = 180 * (1 - p); }, eInOutCubic);
      flapA = 0;
      setPaper(false);
      sealR = 0;
      await tween(.42, p => { sealS = lerp(1.8, 1, eOutBack(p, 2)); sealO = Math.min(1, p * 2.2); });
      sealS = 1; sealO = 1;
      tween(.4, p => { shakeA = Math.sin(p * Math.PI * 4) * 2.2 * (1 - p); }).then(() => { shakeA = 0; });
      state = 'closed';
      seal.disabled = false;
      hit.hidden = false;
    }

    function sealBurst() {
      if (reduceMotion) return;
      const r = seal.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      for (let i = 0; i < 12; i++) {
        const h = document.createElement('span');
        h.className = 'burst';
        h.style.left = cx + 'px'; h.style.top = cy + 'px';
        h.style.zIndex = 31;
        h.style.color = ['#ff8fb1', '#ffd0df', '#f0577f'][i % 3];
        h.innerHTML = heartSVG();
        document.body.appendChild(h);
        const a = rand(0, TAU), d = rand(40, 95);
        h.animate([
          { transform: 'translate(0,0) scale(.3)', opacity: 1 },
          { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d - 24}px) scale(${rand(.5, .95)}) rotate(${rand(-50, 50)}deg)`, opacity: 0 }
        ], { duration: rand(700, 1000), easing: 'cubic-bezier(.15,.75,.3,1)' }).onfinish = () => h.remove();
      }
    }

    function setToggle(isShown) {
      toggleLabel.textContent = isShown ? 'Hide' : 'Show';
      toggle.setAttribute('aria-expanded', String(isShown));
      toggle.classList.toggle('top', isShown);
      toggle.classList.add('seen');
      toggleIcon.innerHTML = isShown
        ? '<path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3.1 4.1M6.6 6.6C3.9 8.3 2.5 12 2.5 12s3.5 7 9.5 7c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'
        : '<rect x="3" y="5.5" width="18" height="13" rx="2.2"/><path d="M3.8 7l8.2 6 8.2-6"/>';
    }

    function show() {
      if (shown) return;
      shown = true;
      clearTimeout(hideTimer);
      layer.hidden = false;
      layout();
      if (dirty || !built) build();
      if (state === 'none') {
        state = 'closed'; glide = 0; flapA = 0; sealS = 1; sealO = 1; sealR = 0;
        setPaper(false);
      }
      if (state === 'closed') {
        tween(.75, p => { appearS = lerp(.5, 1, eOutBack(p, 1.6)); appearY = lerp(70, 0, eOutCubic(p)); });
      } else { appearS = 1; appearY = 0; }
      requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.add('on')));
      setToggle(true);
      if (state === 'open' && !hintDone) showHint(true);
    }
    function hide() {
      if (!shown) return;
      shown = false;
      layer.classList.remove('on');
      setToggle(false);
      dragging = false;
      hideTimer = setTimeout(() => { if (!shown) layer.hidden = true; }, 520);
    }
    toggle.addEventListener('click', () => (shown ? hide() : show()));
    seal.addEventListener('click', e => { e.stopPropagation(); open(); });
    hit.addEventListener('click', open);
    stage.addEventListener('click', e => { if (e.target.closest('.close-env')) { e.stopPropagation(); close(); } });

    // ---- pulling: drag / swipe / wheel / keys ----
    layer.addEventListener('pointerdown', e => {
      if (state !== 'open') return;
      if (e.target.closest('.close-env, .seal, .toggle')) return;
      dragging = true; dragY = e.clientY; dragT = performance.now(); moveV = 0; flingV = 0;
      layer.classList.add('grabbing');
      try { layer.setPointerCapture(e.pointerId); } catch (_) {}
    });
    layer.addEventListener('pointermove', e => {
      if (!dragging) return;
      const now = performance.now();
      const dy = dragY - e.clientY;
      const dtm = Math.max(1, now - dragT);
      const next = Et + dy * (Et > Emax || Et < PEEK ? .35 : 1);
      Et = clamp(next, PEEK - 60, Emax + 60);
      moveV = lerp(moveV, (dy / dtm) * 1000, .4);
      dragY = e.clientY; dragT = now;
    });
    const endDrag = () => {
      if (!dragging) return;
      dragging = false;
      layer.classList.remove('grabbing');
      flingV = performance.now() - dragT > 90 ? 0 : clamp(moveV, -3800, 3800);
    };
    layer.addEventListener('pointerup', endDrag);
    layer.addEventListener('pointercancel', endDrag);
    layer.addEventListener('lostpointercapture', endDrag);
    layer.addEventListener('wheel', e => {
      e.preventDefault();
      if (state !== 'open') return;
      let d = e.deltaY;
      if (e.deltaMode === 1) d *= 18; else if (e.deltaMode === 2) d *= vh;
      Et = clamp(Et + d * .9, PEEK - 30, Emax + 30);
      flingV = 0;
    }, { passive: false });
    addEventListener('keydown', e => {
      if (!shown) return;
      if (e.key === 'Escape') { hide(); toggle.focus({ preventScroll: true }); return; }
      if (state !== 'open') return;
      if ((e.key === ' ' || e.key === 'Enter') && e.target && e.target.closest && e.target.closest('button') && !(e.key === 'Enter' && atEnd)) return;
      const steps = { ArrowDown: 70, ArrowUp: -70, PageDown: vh * .6, PageUp: -vh * .6, ' ': vh * .5, End: 1e6, Home: -1e6 };
      if (e.key in steps) { e.preventDefault(); Et = clamp(Et + steps[e.key], PEEK, Emax); flingV = 0; }
      else if (e.key === 'Enter' && atEnd) { e.preventDefault(); close(); }
    });

    return {
      layout: () => { layout(); },
      refresh: () => { dirty = true; layout(); },
      update,
      get shown() { return shown; },
      get mode() { return mode; }
    };
  })();

  /* ================= main loop ================= */
  let last = performance.now();
  function frame(nowMs) {
    const dt = Math.min(.05, Math.max(.001, (nowMs - last) / 1000));
    last = nowMs;
    const now = nowMs / 1000;
    Night.draw(now, dt, Letter.shown);
    Letter.update(now, dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  let rT = 0;
  addEventListener('resize', () => {
    clearTimeout(rT);
    rT = setTimeout(() => { Night.layout(); Letter.layout(); Question.onResize(); }, 120);
  });
  if (document.fonts && document.fonts.addEventListener) {
    document.fonts.addEventListener('loadingdone', () => { Letter.refresh(); });
  }
})();
</script>

</body>
